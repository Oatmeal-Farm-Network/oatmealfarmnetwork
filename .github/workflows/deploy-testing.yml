name: Deploy Frontend Testing

# GCP/frontend-testing → oatmeal-frontend-testing
# Bake TESTING_* URLs only. Do not default to staging or production APIs.
# Fails clearly until TESTING_* secrets/vars exist.
on:
  push:
    branches: [GCP/frontend-testing]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.TESTING_GCP_PROJECT_ID }}
  REGION: ${{ vars.TESTING_REGION || 'us-central1' }}
  IMAGE_URI_PREFIX: ${{ vars.TESTING_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.TESTING_GCP_PROJECT_ID }}/${{ vars.TESTING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}/frontend
  CLOUD_RUN_SERVICE: oatmeal-frontend-testing
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.TESTING_FRONTEND_RUNTIME_SA }}
  VITE_API_URL: ${{ vars.TESTING_BACKEND_URL }}
  VITE_SAIGE_API_URL: ${{ vars.TESTING_SAIGE_URL }}
  VITE_CROP_API_URL: ${{ vars.TESTING_CROP_API_URL }}
  VITE_NEWS_API_URL: ${{ vars.TESTING_NEWS_API_URL }}
  VITE_CONTACT_RECIPIENT_EMAIL: ${{ vars.TESTING_CONTACT_EMAIL }}
  VITE_OTF_API_URL: ${{ vars.TESTING_OTF_API_URL || '' }}

jobs:
  deploy-testing:
    runs-on: ubuntu-latest
    environment: testing
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require testing secrets and bake vars
        shell: bash
        run: |
          missing=0
          require() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub Actions secret/variable: $name"
              missing=1
            fi
          }
          require TESTING_GCP_PROJECT_ID "${{ secrets.TESTING_GCP_PROJECT_ID }}"
          require TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER "${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          require TESTING_GCP_SERVICE_ACCOUNT "${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}"
          require TESTING_FRONTEND_RUNTIME_SA "${{ vars.TESTING_FRONTEND_RUNTIME_SA }}"
          require TESTING_BACKEND_URL "${{ vars.TESTING_BACKEND_URL }}"
          require TESTING_SAIGE_URL "${{ vars.TESTING_SAIGE_URL }}"
          project="${{ secrets.TESTING_GCP_PROJECT_ID }}"
          if [ -n "$project" ] && [ "$project" != "oatmeal-farm-staging" ]; then
            echo "::error::TESTING_GCP_PROJECT_ID must be oatmeal-farm-staging. Never animated-flare-421518 (Oatmeal AI)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Testing deploy blocked until TESTING_* secrets/vars are set."
            echo "Create Cloud Run oatmeal-frontend-testing in oatmeal-farm-staging first."
            echo "See docs/FRONTEND_STAGING_DEPLOY.md. Do not reuse PROD_* or mix staging API URLs."
            exit 1
          fi

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Testing)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.TESTING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.TESTING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "VITE_API_URL=${{ env.VITE_API_URL }}" \
            --build-arg "VITE_SAIGE_API_URL=${{ env.VITE_SAIGE_API_URL }}" \
            --build-arg "VITE_CROP_API_URL=${{ env.VITE_CROP_API_URL }}" \
            --build-arg "VITE_NEWS_API_URL=${{ env.VITE_NEWS_API_URL }}" \
            --build-arg "VITE_CONTACT_RECIPIENT_EMAIL=${{ env.VITE_CONTACT_RECIPIENT_EMAIL }}" \
            --build-arg "VITE_OTF_API_URL=${{ env.VITE_OTF_API_URL }}" \
            -t "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}"

      - name: Deploy to Cloud Run (testing)
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}" \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --quiet

      - name: Print deployed URL
        run: |
          gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --format="value(status.url)"
